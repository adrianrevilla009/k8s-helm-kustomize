apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-orders-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: {{ .Values.testImage }}
      command: ["wget", "-qO-", "http://{{ .Release.Name }}-orders:{{ .Values.service.port }}/actuator/health"]
