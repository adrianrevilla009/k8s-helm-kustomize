apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      containers:
        - name: orders
          image: ghcr.io/example/orders:1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: default
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
