apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders-dev
namePrefix: dev-
resources:
  - ../../base
images:
  - name: ghcr.io/example/orders
    newTag: 1.0.0-SNAPSHOT
replicas:
  - name: orders
    count: 1
patches:
  - target: {kind: Deployment, name: orders}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
